# 合并进 ~/.hermes/config.yaml 的 Slack 片段（与顶层键同级，不是 gateway: 下面的）
platforms:
  slack:
    enabled: true
    # cron / 定时消息 / 主动通知的默认落脚频道（channel ID，C 开头）
    home_channel:
      platform: slack
      chat_id: C01234567890        # 改成你的频道
      name: general
      # user_id / scope_id 由网关自动回填，可不填
    extra:
      # 频道里顶层直接回复（false）；true = 开 thread 回复
      reply_in_thread: false
      # 多 agent 协作：只有对方 bot 的消息里明确 @了本 bot 才受理（防回环推荐值）。
      # 只管 bot 签名消息的受理，不是身份白名单；带 user_id 的 bot 帖还需通过用户授权（README「授权模型」）
      allow_bots: mentions
      # Block Kit 富渲染（表格/嵌套列表/分割线），纯发送侧开关，无需重装 App
      rich_blocks: true
      # 以下候选字段仅在应用 natural-collaboration-836.patch 后生效。
      # 精确 workspace:channel 白名单；不需要为每个新任务配置根消息 ts。
      # collaboration_channels:
      #   "T01234567890:C01234567890":
      #     max_messages: 100       # 1..200；最近频道顶层消息，超限标 Context gap
      #     max_chars: 40000        # 1..100000；按整条消息保留，不切断正文

# 同一候选补丁提供平台专属的 busy ACK 静默；审批和输入处理继续运行。
# display:
#   platforms:
#     slack:
#       busy_ack_enabled: false

